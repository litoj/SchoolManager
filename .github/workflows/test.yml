# Unit tests and lint on every commit.
name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer commit makes the run queued for the same branch pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # app/build.gradle.kts pins the toolchain to 21 and nothing provisions
      # toolchains, so the job has to bring that JDK itself.
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '21'

      # Robolectric fetches its instrumented SDK jar into ~/.m2 itself, outside
      # Gradle, so that directory needs this cache of its own.
      - uses: actions/cache@v6
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-15-robolectric-13954326-i7

      # Restores the dependency and build caches; org.gradle.caching is already on.
      - uses: gradle/actions/setup-gradle@v6

      # A cold pull hits Maven Central rate limits with 429, so the fetch retries.
      # The version matches the @Config(sdk = [35]) pins.
      - name: Fetch the Robolectric SDK
        run: |
          sdk=15-robolectric-13954326-i7
          jar="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$sdk/android-all-instrumented-$sdk.jar"
          if [ ! -f "$jar" ]; then
            mkdir -p "$(dirname "$jar")"
            curl -fsSL --retry 10 --retry-delay 5 \
              "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$sdk/android-all-instrumented-$sdk.jar" \
              -o "$jar.part"
            mv "$jar.part" "$jar"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Release too: lint checks each variant.
      # This one carries the release build config, so it must not pass unchecked.
      - name: Lint
        run: ./gradlew :app:lintDebug :app:lintRelease --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
